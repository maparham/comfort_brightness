# XcodeGen spec. Regenerate the project with:  xcodegen generate
#
# The .xcodeproj is a build artifact and is git-ignored; this file is the source
# of truth. The Swift package remains authoritative for the engine and its tests
# (`swift test` still works and is what CI would run) — the Xcode target exists so
# the app can be built and run as a real, properly signed .app bundle.

name: AutoBrightness

options:
  bundleIdPrefix: com.mahmoudparham
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AutoBrightness:
    path: .

targets:
  AutoBrightness:
    type: application
    platform: macOS

    sources:
      # Only the shell. The engine arrives via the package dependency below, so
      # there is exactly one copy of it compiled into the app.
      - path: Sources/AutoBrightnessApp
      - path: Resources/Icon/AppIcon.icns
        buildPhase: resources

    dependencies:
      - package: AutoBrightness
        product: AutoBrightnessCore

    preBuildScripts:
      # Gives every build its own CFBundleVersion.
      #
      # It writes a stamped *copy* of Info.plist into the derived-files dir and
      # INFOPLIST_FILE points at that copy, rather than stamping the plist inside
      # the built .app. Xcode schedules script phases early and ProcessInfoPlist
      # late, so anything written into the bundle here is overwritten from the
      # source plist before signing — generating the input is the only placement
      # the ordering actually respects.
      #
      # Resources/Info.plist stays the source of truth and stays untouched: a
      # plist rewritten on every build would put a spurious diff in front of
      # every commit and conflict on every rebase. The counter lives in a
      # git-ignored file at the repo root rather than in DerivedData so that
      # "Clean Build Folder" does not send the number back to 1.
      #
      # Inline rather than a file under Scripts/ because script sandboxing (on,
      # below) refuses to read a script out of the source tree.
      - name: Stamp build number
        # basedOnDependencyAnalysis would let Xcode skip the phase whenever its
        # outputs look up to date, and a number that only sometimes moves is
        # worse than no number at all.
        basedOnDependencyAnalysis: false
        # Declared so the sandbox grants this phase the reads and writes it
        # needs; it permits exactly the files named here.
        inputFiles:
          - $(SRCROOT)/Resources/Info.plist
        outputFiles:
          - $(SRCROOT)/.build-number
          - $(DERIVED_FILE_DIR)/Info.plist
        script: |
          set -euo pipefail
          counter="${SRCROOT}/.build-number"
          # A missing or corrupt counter restarts the count at 1 rather than
          # failing the build.
          current=$(cat "$counter" 2>/dev/null || true)
          [[ "$current" =~ ^[0-9]+$ ]] || current=0
          next=$((current + 1))
          printf '%s\n' "$next" > "$counter"

          mkdir -p "${DERIVED_FILE_DIR}"
          cp "${SRCROOT}/Resources/Info.plist" "${DERIVED_FILE_DIR}/Info.plist"
          # plutil rather than PlistBuddy: PlistBuddy answers a plist it cannot
          # read by writing an empty one, which then looks like a valid, merely
          # up-to-date Info.plist to the rest of the build.
          plutil -replace CFBundleVersion -string "$next" \
            "${DERIVED_FILE_DIR}/Info.plist"
          echo "note: build number $next"

    settings:
      base:
        # The stamped copy the "Stamp build number" phase writes, not the
        # checked-in original. Resources/Info.plist remains the source of truth
        # and the file to edit; only CFBundleVersion differs between them.
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: AutoBrightness
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmoudparham.AutoBrightness

        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"

        # A real signing identity is the whole point of this target. macOS ties
        # Screen Recording permission to the code signature, so a stable identity
        # means the permission is granted once rather than on every rebuild.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 92G3VZAPVG
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES

        # The app resolves DisplayServices/CoreDisplay symbols with dlopen. Those
        # are Apple system frameworks, which the hardened runtime permits — no
        # library-validation exception is needed, and none is granted here.

        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

      configs:
        Release:
          # Distributable identity for anything leaving this machine. Notarize
          # before sharing; Gatekeeper will otherwise quarantine it.
          #
          # Manual signing, because Xcode refuses to reconcile a named identity
          # with the automatic signing the Debug side wants: automatic picks the
          # identity from a provisioning profile it manages, so naming one here
          # is a contradiction and the build fails before it starts. Developer ID
          # needs no profile — the certificate alone is enough.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: ""
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  AutoBrightness:
    build:
      targets:
        AutoBrightness: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
